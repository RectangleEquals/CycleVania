[workspace]
resolver = "2"
members = [
    "crates/cv-determinism",
    "crates/cv-manifest",
    "crates/cv-cvb",
    "crates/cv-api",
    "crates/cv-core",
    "crates/cv-compile",
    "crates/cv-assets",
    "crates/cv-vm",
    "crates/cv-bindings",
    "crates/cv-cli",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
# Internal crates (path-referenced so versions stay in lockstep).
cv-determinism = { path = "crates/cv-determinism" }
cv-manifest = { path = "crates/cv-manifest" }
cv-api = { path = "crates/cv-api" }
cv-core = { path = "crates/cv-core" }
cv-vm = { path = "crates/cv-vm" }
cv-cvb = { path = "crates/cv-cvb" }
cv-assets = { path = "crates/cv-assets" }
# Host-facing / tooling deps.
napi = { version = "3" }
napi-derive = { version = "3" }
napi-build = { version = "2" }
wasm-bindgen = { version = "0.2" }
clap = { version = "4", features = ["derive"] }

# Determinism note: Rust never enables fast-math and does not auto-contract to FMA (fp-contract off),
# so the default codegen is already replayable. Cross-machine determinism comes from owned math (M02)
# + the WASM canonical target, not from profile flags. codegen-units=1 buys native reproducibility.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# The determinism guard: the banned list lives in clippy.toml. Platform transcendentals (f64::sin …)
# and clock reads are denied workspace-wide; the owned replacements are in cv_determinism::math.
disallowed_methods = "deny"
