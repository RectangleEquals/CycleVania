  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "A label for a developer reading the viewport. Deliberately not a lookup key."

  [[class.field]]
  name = "accepts"
  type = "TagQuery"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Which content may mount here."

  [[class.field]]
  name = "faces"
  type = "Array<Face>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Which faces of the mounted thing may meet this socket."

  [[class.field]]
  name = "clearance"
  type = "Ref<CollisionBody>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Space that must stay empty around whatever mounts here."

  [[class.method]]
