  [[class.value]]
  name = "STATIC"
  [[class.value]]
  name = "DYNAMIC"

[[class]]
path = "/Core/QueryFilter"
kind = "enum"
status = "stable"
doc = "Coarse query scoping."
  [[class.value]]
  name = "ALL"
  [[class.value]]
  name = "NONE"
  [[class.value]]
  name = "WORLD"
  [[class.value]]
  name = "PLACED"

[[class]]
path = "/Core/CollisionMode"
kind = "enum"
status = "proposed"
doc = "PROPOSED. How collision is derived from geometry. The design names the enum but not its values; these are the minimum set the pipeline needs and must be confirmed when mesh import lands."
  [[class.value]]
  name = "NONE"
  doc = "Visible, never collidable."
  [[class.value]]
  name = "CONVEX_HULL"
  [[class.value]]
  name = "DECOMPOSED"
  [[class.value]]
  name = "TRIANGLE_MESH"
  [[class.value]]
  name = "AUTHORED"
  doc = "Use a separately authored collision body rather than deriving one."

[[class]]
path = "/Core/Replenish"
