  type = "Kind<Object>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "The token class required."

  [[class.field]]
  name = "count"
  type = "int"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  default = "1"
  doc = "How many. Quantity lives here, not in a number of instances."

[[class]]
path = "/Core/HasComponentRule"
extends = "/Core/Rule"
kind = "object"
sealed = true
status = "stable"
doc = "The occupant holds something CARRYING a matching component. Branching on components is sound where branching on tokens is not."

  [[class.field]]
  name = "kind"
  type = "Kind<Component>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "The component class required."

[[class]]
path = "/Core/AllOfRule"
extends = "/Core/Rule"
kind = "object"
sealed = true
status = "stable"
doc = "Every child holds."

  [[class.field]]
  name = "children"
  type = "Array<Ref<Rule>>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "The conjuncts."

[[class]]
path = "/Core/AnyOfRule"
extends = "/Core/Rule"
kind = "object"
sealed = true
status = "stable"
doc = "At least one child holds. This is what proves genuine alternate routes rather than one route the solver happened to pick."

  [[class.field]]
  name = "children"
  type = "Array<Ref<Rule>>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "The disjuncts."

[[class]]
path = "/Core/NegateRule"
extends = "/Core/Rule"
kind = "object"
sealed = true
status = "stable"
doc = "The inner rule does NOT hold. Non-monotonic, so it is accepted and reported rather than refused."

  [[class.field]]
  name = "inner"
  type = "Ref<Rule>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "The negated rule."

[[class]]
path = "/Core/NearbyRule"
extends = "/Core/Rule"
kind = "object"
sealed = true
status = "stable"
doc = "Something matching is accessible within range of this gate. The contextual half: a gate may depend on the WORLD rather than only the occupant, and because the dependency walk sees it, requires() can plant the source."

  [[class.field]]
  name = "kind"
  type = "Kind<Object>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "What must be nearby."

  [[class.field]]
  name = "within"
  type = "Ref<Budget>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "How near, in whatever currency the budget names."

  [[class.field]]
  name = "scope"
  type = "InstanceScope"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "The scope searched."

