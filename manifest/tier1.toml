# =====================================================================================
# Surface
# =====================================================================================

[[class]]
path = "/Core/Surface"
extends = "/Core/Object"
kind = "object"
sealed = false
status = "stable"
doc = "What a piece of geometry means to a mechanic. Answers who may be here and what works here."

  [[class.field]]
  name = "name"
  type = "String"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Display name."

  [[class.field]]
  name = "tags"
  type = "Array<Tag>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Why an eligible-surface list is a TagQuery rather than a hand-maintained class list. The editor must show these on selected geometry."

  [[class.method]]
  name = "supports"
  args = [ { name = "ctx", type = "Ref<Context>" }, { name = "occupant", type = "Occupant" } ]
  returns = "Array<Support>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "[ Support(AlwaysRule) ]"
  doc = "Can something BE here? A state you are in, evaluated per occupant and per sphere."

  [[class.method]]
  name = "affords"
  args = [ { name = "ctx", type = "Ref<Context>" }, { name = "attempt", type = "Ref<Interaction>" } ]
  returns = "Ref<Rule>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "AlwaysRule"
  doc = "Does an ACTION work here? Covers transit THROUGH as well as action UPON, which is how one pane of glass blocks ballistics and walking while passing a laser and a sightline."

  [[class.method]]
  name = "friction"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "float"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "1.0"
  doc = "Traversal resistance."

  [[class.method]]
  name = "harm"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Harm"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "Harm.NONE"
  doc = "Is standing here dangerous?"

  [[class.method]]
  name = "admits_mount"
  args = [ { name = "ctx", type = "Ref<Context>" }, { name = "m", type = "Ref<MountComponent>" } ]
  returns = "Ref<Rule>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "AlwaysRule"
  doc = "May something mount against this surface?"

# =====================================================================================
# Rule — SEALED. The cheap, provable half the solver walks.
# =====================================================================================

[[class]]
path = "/Core/Rule"
extends = "/Core/Object"
kind = "object"
sealed = true
status = "stable"
doc = "Sealed on purpose: the solver walks this tree as the analysable half of a gate, so a developer-defined rule would make the dependency walk impossible."

  [[class.method]]
  name = "is_open"
  args = []
  returns = "bool"
  api = true
  final = true
  status = "stable"
  doc = "Does this rule currently hold?"

  [[class.method]]
  name = "referenced"
  args = []
  returns = "Array<Kind<Object>>"
  api = true
  final = true
  status = "stable"
  doc = "Every token this rule mentions. The solver's dependency walk, and what lets requires() plant a source."

  [[class.method]]
  name = "explain"
  args = []
  returns = "String"
  api = true
  final = false
  status = "stable"
  doc = "Prose for a lock badge and the trace."

[[class]]
path = "/Core/AlwaysRule"
extends = "/Core/Rule"
kind = "object"
sealed = true
status = "stable"
doc = "Trivially satisfied. The identity of AllOfRule."

[[class]]
path = "/Core/NeverRule"
extends = "/Core/Rule"
kind = "object"
sealed = true
status = "stable"
doc = "Never satisfied. The identity of AnyOfRule. On a sole route this is an authoring error and is reported with the numbers, not silently accepted."

[[class]]
path = "/Core/HoldsRule"
extends = "/Core/Rule"
kind = "object"
sealed = true
status = "stable"
