[[class]]
path = "/Core/Curve"
kind = "struct"
status = "stable"
doc = "2D point data and NOT a resource — one row of a CurveTableResource. points, interpolation, sample, constant, ramp, from_points."

[[class]]
path = "/Core/Dial"
kind = "struct"
status = "stable"
doc = "A DEVELOPER-AUTHORED, named, tunable value owned by a Schematic or a Spine slot — how a host keeps fine-grained control over authored content at runtime. Identity is <ClassName>.<DialName>. Always exposed; always optional; the core ships none, and there is no such thing as a core dial. Holds a number, a hard range, a soft AdaptiveRange, an enum value, one curve, or a whole curve table whose named eval input it drives for every row. Resolves ONCE per generation pass, so it never changes underneath a decision mid-pass — which is why changing one is a different recipe and regenerates the world."

[[class]]
path = "/Core/AdaptiveRange"
kind = "struct"
status = "stable"
doc = "soft_min, hard_max, and target(available) computed from what is genuinely placeable. Falls below soft_min HONESTLY under content scarcity rather than padding with repeated filler or breaking outright."

[[class]]
path = "/Core/Quantity"
kind = "struct"
status = "stable"
doc = "initial, max, consumable."

[[class]]
path = "/Core/Pool"
kind = "struct"
status = "stable"
doc = "A resource an occupant draws on. capacity, reserve, and available(ctx) — the last is what every soft gate compares against, because capacity alone cannot answer how much is held at a given sphere."

[[class]]
path = "/Core/Harm"
kind = "struct"
status = "stable"
doc = "radius, severity 0..1, avoidable, continuous, mitigated_by, and NONE."

[[class]]
path = "/Core/Support"
kind = "struct"
status = "stable"
doc = "permitted (a Rule), max_slope, endurance (a Budget). Returned per occupant by Surface.supports."

[[class]]
path = "/Core/Approach"
kind = "struct"
status = "stable"
doc = "distance (a Span), max_slope, surface. What an occupant needs at the near end of a traversal."

[[class]]
path = "/Core/Occupant"
kind = "struct"
status = "stable"
doc = "Who is standing, as a parameter. actor (null for the player), is_player, held, holds(kind), footprint."

[[class]]
path = "/Core/Hit"
kind = "struct"
status = "stable"
doc = "A query result. valid, distance, point, normal, actor, component, island, polygon, triangle, surface, face, fidelity, and certainty. Fields below the achieved detail are ABSENT, which is checkable rather than sentinel-valued."

[[class]]
