  args = [ { name = "from", type = "Vec3" }, { name = "to", type = "Vec3" }, { name = "held", type = "Array<Kind<Object>>" } ]
  returns = "Trivalent"
  api = true
  final = true
  status = "stable"
  doc = "Can an occupant holding these tokens get from here to there? Trivalent, not bool, because the API must not be able to lie."
