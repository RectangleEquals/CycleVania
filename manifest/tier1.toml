# CycleVania tier-1 API manifest
#
# THE single hand-authored declaration of tier-1. Every other surface is generated from this file:
# the Rust trait skeletons, the TypeScript declarations, the editor's node palette, and the API
# reference document itself. Editing any of those by hand is a bug.
#
# Schema (see .notes/Design/v0.2b/06-api/README.md):
#
#   [[class]]                path · extends · kind · sealed · abstract · status · doc
#     [[class.field]]        name · type · exposed · mutable · api · final · status · doc · default
#     [[class.method]]       name · args · returns · api · final · hook · status · doc · default
#     [[class.value]]        name · doc                  (kind = "enum" only)
#
# `kind` is one of: object · struct · enum.
# `status` is one of: proposed · stable · deprecated. Generated palettes ship only `stable`.
# `hook = true` marks a question the core asks; it is what generates a schematic's OVERRIDES list.
#
# ⚠ `field` versus `method` is semantic, not cosmetic. A plain read of something already known is a
# field and becomes a pure get node with no exec pins; anything that takes an argument, computes, or
# mutates is a method and becomes a call node with them. The signal a method sends is COST.

version = 1

# =====================================================================================
# Object — the root of the identity family
# =====================================================================================

[[class]]
path = "/Core/Object"
kind = "object"
sealed = false
status = "stable"
doc = "The root of everything with identity. Has metadata, has a rationale, can be asked what it is."

  [[class.field]]
  name = "id"
  type = "ObjectId"
  api = true
  final = true
  status = "stable"
  doc = "Opaque identity. A string or opaque handle — NEVER a u64, because TS integers alias past 2^53."

  [[class.field]]
  name = "type_path"
  type = "String"
  api = true
  final = true
  status = "stable"
  doc = "The mount-pointed class path this object was instantiated from."

  [[class.field]]
  name = "rationale"
  type = "Ref<Rationale>"
  api = true
  final = true
  status = "stable"
  doc = "Why the core did what it did with this object. Core-written."

  [[class.field]]
  name = "meta_keys"
  type = "Array<String>"
  api = true
  final = true
  status = "stable"
  doc = "Every metadata key currently set."

  [[class.method]]
  name = "is_a"
  args = [ { name = "kind", type = "Kind<Object>" } ]
  returns = "bool"
  api = true
  final = true
  status = "stable"
  doc = "Class-membership test against a picked class path."

  [[class.method]]
  name = "equals"
  args = [ { name = "other", type = "Ref<Object>" } ]
  returns = "bool"
  api = true
  final = true
  status = "stable"
  doc = "Identity comparison. Never a float comparison."

  [[class.method]]
  name = "satisfied_by"
  args = [ { name = "candidate", type = "Kind<Object>" } ]
  returns = "bool"
  api = true
  final = false
  status = "stable"
  default = "candidate is-a my kind"
  doc = "Does this candidate class satisfy a requirement for me? Runs on the CLASS DEFAULT, never an instance — which is how a longer rope satisfies a requirement for a shorter one without constructing either."

  [[class.method]]
  name = "format"
  args = []
  returns = "String"
  api = true
  final = false
  status = "stable"
  default = "TypeName#id"
  doc = "Short display form."

  [[class.method]]
  name = "explain"
  args = []
  returns = "String"
  api = true
  final = false
  status = "stable"
  default = "format()"
  doc = "Prose a developer reads in the trace."

  [[class.method]]
  name = "meta"
  args = [ { name = "key", type = "String" } ]
  returns = "MetaValue"
  api = true
  final = true
  status = "stable"
  doc = "Read one metadata value."

  [[class.method]]
  name = "set_meta"
  args = [ { name = "key", type = "String" }, { name = "value", type = "MetaValue" } ]
  returns = "void"
  api = true
  final = true
  status = "stable"
  doc = "Write one metadata value. The CV_ prefix is reserved for the core and rejected here."

  [[class.method]]
  name = "has_meta"
  args = [ { name = "key", type = "String" } ]
  returns = "bool"
  api = true
  final = true
  status = "stable"
  doc = "Is this key set?"

  [[class.method]]
  name = "remove_meta"
  args = [ { name = "key", type = "String" } ]
  returns = "void"
  api = true
  final = true
  status = "stable"
  doc = "Clear one metadata value."

  [[class.method]]
  name = "_configure"
  args = []
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Setup phase 1. Own configuration only; other content may not exist yet."

  [[class.method]]
  name = "_resolve"
  args = []
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Setup phase 2. Every registered content class now exists and may be referenced."

# =====================================================================================
# Actor — something placeable, and the sole point of contact (P11)
# =====================================================================================

[[class]]
path = "/Core/Actor"
extends = "/Core/Object"
kind = "object"
sealed = false
status = "stable"
doc = "Something placeable in a world. The only thing the core places, and the sole point of contact between content and generation."

  [[class.field]]
  name = "components"
  type = "Array<Ref<Component>>"
  api = true
  final = true
  status = "stable"
  doc = "Attached components, in attach order — which is the order every aggregating hook walks."

  [[class.field]]
  name = "parent"
  type = "Ref<Actor>"
  api = true
  final = true
  status = "stable"
  doc = "The actor this one is mounted on, if any."

  [[class.field]]
  name = "children"
  type = "Array<Ref<Actor>>"
  api = true
  final = true
  status = "stable"
  doc = "Actors mounted on this one."

  [[class.field]]
  name = "transform"
  type = "Transform"
  api = true
  final = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Local transform relative to the parent."

  [[class.field]]
  name = "skip_policy"
  type = "SkipPolicy"
  api = true
  final = false
  mutable = true
  exposed = true
  status = "stable"
  default = "TOLERATED"
  doc = "Whether alternative routes past this actor's gate are tolerated, reported, or actively forbidden. Inert unless gate() is non-trivial."

  [[class.field]]
  name = "discoverability"
  type = "float"
  api = true
  final = false
  mutable = true
  exposed = true
  status = "stable"
  default = "1.0"
  doc = "The declared likelihood a player finds this gate's solution unprompted. Declared because it is not derivable; above the threshold the solver treats the gate as open, conservatively, and names it in the trace."

  [[class.method]]
  name = "component"
  args = [ { name = "kind", type = "Kind<Component>" } ]
  returns = "Ref<Component>"
  api = true
  final = true
  status = "stable"
  doc = "First attached component of that kind."

  [[class.method]]
  name = "components_of"
  args = [ { name = "kind", type = "Kind<Component>" } ]
  returns = "Array<Ref<Component>>"
  api = true
  final = true
  status = "stable"
  doc = "Every attached component of that kind."

  [[class.method]]
  name = "add_component"
  args = [ { name = "c", type = "Ref<Component>" } ]
  returns = "void"
  api = true
  final = true
  status = "stable"
  doc = "Attach a component."

  [[class.method]]
  name = "remove_component"
  args = [ { name = "c", type = "Ref<Component>" } ]
  returns = "void"
  api = true
  final = true
  status = "stable"
  doc = "Detach a component."

  [[class.method]]
  name = "attach_to"
  args = [ { name = "parent", type = "Ref<Actor>" }, { name = "mount", type = "Ref<MountComponent>" } ]
  returns = "void"
  api = true
  final = true
  status = "stable"
  doc = "Mount this actor onto another at a named socket."

  [[class.method]]
  name = "world_transform"
  args = []
  returns = "Transform"
  api = true
  final = true
  status = "stable"
  doc = "Absolute transform. Walks the parent chain, so it is not free."

  [[class.method]]
  name = "pivot"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Vec3"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "Vec3.ZERO"
  doc = "The point this actor rotates and mounts about."

  [[class.method]]
  name = "bounds"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Aabb"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "union of component bounds"
  doc = "Axis-aligned extent."

  [[class.method]]
  name = "footprint"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Ref<CollisionBody>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "union of component collision"
  doc = "The space this reserves during skeleton layout."

  [[class.method]]
  name = "clearance"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Ref<CollisionBody>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "empty"
  doc = "Space that must stay empty around this actor. Called per candidate position, so it must stay cheap."

  [[class.method]]
  name = "collision"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Ref<CollisionBody>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "union of component collision"
  doc = "What this actor physically blocks."

  [[class.method]]
  name = "mount_faces"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Face>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "[ POS_Y ]"
  doc = "Which faces this may be mounted against. Floor, wall or ceiling is what distinguishes a chest from a sconce from a chandelier."

  [[class.method]]
  name = "up_axis"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Vec3"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "Vec3.UP"
  doc = "Which direction is up for this actor."

  [[class.method]]
  name = "yaw_snap"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "int"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "4"
  doc = "Rotational quantisation about the up axis. 0 = free, 4 = 90 degrees."

  [[class.method]]
  name = "allow_pitch"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "bool"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "false"
  doc = "May the solver tilt this out of the up axis?"

  [[class.method]]
  name = "allow_roll"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "bool"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "false"
  doc = "May the solver roll this about its forward axis?"

  [[class.method]]
  name = "scalable"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Span"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "Span(1, 1)"
  doc = "Permitted uniform scale range. A lever a fixed-template system cannot have; convexity is affine-invariant, so the collision cache survives it."

  [[class.method]]
  name = "uniform_scale_only"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "bool"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "true"
  doc = "Forbid non-uniform scaling."

  [[class.method]]
  name = "embed_depth"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Span"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "Span(0, 0)"
  doc = "How far this may sink into the surface it mounts on."

  [[class.method]]
  name = "constraints"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Ref<Constraint>>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "[]"
  doc = "Hard placement constraints. A door names its own token here, which is where key-to-lock distance is written."

  [[class.method]]
  name = "preferences"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Ref<Preference>>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "[]"
  doc = "Soft placement biases. Relaxable, and reported when relaxed."

  [[class.method]]
  name = "eligible_roles"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Role>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "all roles"
  doc = "Which roles this actor may be assigned. Role is an output; this only narrows the candidate set."

  [[class.method]]
  name = "schedule"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Ref<ScheduleRule>>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "[]"
  doc = "Ordering rules relative to other content."

  [[class.method]]
  name = "quota"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Quota"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "How many of this may exist, per scope."

  [[class.method]]
  name = "weight"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "float"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "1.0"
  doc = "Selection bias among eligible candidates."

  [[class.method]]
  name = "repulsion"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "float"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "0.0"
  doc = "How strongly instances of this push away from each other. A pressure, never an obligation."

  [[class.method]]
  name = "enables"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Ref<Interaction>>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "aggregate enabled components in attach order"
  doc = "What can be done here."

  [[class.method]]
  name = "requires"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Ref<PlacementNeed>>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "aggregate enabled components in attach order"
  doc = "What must exist near me for my mechanic to work. This is the hook that makes the generator place enabling content."

  [[class.method]]
  name = "forbids"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Ref<Exclusion>>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "aggregate enabled components in attach order"
  doc = "What must NOT be near me. The negative half of an obligation."

  [[class.method]]
  name = "judge"
  args = [ { name = "ctx", type = "Ref<Context>" }, { name = "path", type = "Ref<Path>" } ]
  returns = "Ref<Verdict>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "AcceptedVerdict"
  doc = "Is this proposal good, and how wrong is it? The magnitude is the point: a boolean turns the placement search into a reroll."

  [[class.method]]
  name = "gate"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Ref<Rule>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "AlwaysRule"
  doc = "What the occupant must hold to pass."

  [[class.method]]
  name = "harm"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Harm"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "Harm.NONE"
  doc = "Is this dangerous, how much, and is it avoidable?"

  [[class.method]]
  name = "grants"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Array<Kind<Object>>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "aggregate enabled components in attach order"
  doc = "Tokens the occupant keeps after reaching this. CLASSES, never instances — the lattice is over identities, and a token class already is one."

  [[class.method]]
  name = "on_proposed"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: the solver is considering this position."

  [[class.method]]
  name = "on_placed"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: this actor was committed to a position."

  [[class.method]]
  name = "on_rejected"
  args = [ { name = "ctx", type = "Ref<Context>" }, { name = "why", type = "Ref<Verdict>" } ]
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: a candidate position was refused, with the verdict that refused it."

  [[class.method]]
  name = "on_obtained"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: an occupant reached this and took what it grants."

  [[class.method]]
  name = "on_component_changed"
  args = [ { name = "c", type = "Ref<Component>" } ]
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: an attached component invalidated itself."

  [[class.method]]
  name = "on_finalized"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: generation is complete and this actor is realized."

  [[class.method]]
  name = "reset"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: the solver is backtracking past this actor. Lets a rewind be clean."

[[class]]
path = "/Core/Item"
extends = "/Core/Actor"
kind = "object"
sealed = false
status = "stable"
doc = "An obtainable actor. The thing that hands out tokens, as distinct from the tokens themselves."

  [[class.method]]
  name = "classification"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "ItemClass"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "PROGRESSION"
  doc = "What kind of reward this is. An INPUT the developer declares, never an output — and it defaults to the conservative answer."

  [[class.method]]
  name = "quantity"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Quantity"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "Quantity(1, 1, false)"
  doc = "How many, and whether taking it consumes it."

  [[class.method]]
  name = "replenishes"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Replenish"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "NEVER"
  doc = "Whether and how this comes back."

# =====================================================================================
# Component — where logic is actually written
# =====================================================================================

[[class]]
path = "/Core/Component"
extends = "/Core/Object"
kind = "object"
sealed = false
status = "stable"
doc = "An attachable behaviour with its own transform. The seven hooks have the same signatures as Actor, and this is where a mechanic is written."

  [[class.field]]
  name = "owner"
  type = "Ref<Actor>"
  api = true
  final = true
  status = "stable"
  doc = "The actor this is attached to."

  [[class.field]]
  name = "enabled"
  type = "bool"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  default = "true"
  doc = "Disabled components are skipped by every aggregating hook."

  [[class.field]]
  name = "transform"
  type = "Transform"
  api = true
  final = true
  mutable = true
  exposed = true
  status = "stable"
  default = "identity"
  doc = "Local transform relative to the owner."

  [[class.method]]
  name = "world_transform"
  args = []
  returns = "Transform"
  api = true
  final = true
  status = "stable"
  doc = "Absolute transform. Walks the parent chain, so it is not free."

  [[class.method]]
  name = "invalidate"
  args = []
  returns = "void"
  api = true
  final = true
  status = "stable"
  doc = "Signal that this component changed; the owner receives on_component_changed."

  [[class.method]]
  name = "on_attached"
  args = [ { name = "owner", type = "Ref<Actor>" } ]
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: attached to an actor."

  [[class.method]]
  name = "on_detached"
  args = []
  returns = "void"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Event: detached from an actor."

  [[class.method]]
  name = "validate"
  args = []
  returns = "Array<Diagnostic>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "[]"
  doc = "Editor-time self-check. Never blocks generation."

  [[class.method]]
  name = "replenishes"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Replenish"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "NEVER"
  doc = "Whether this component's supply comes back. Not only Items: a dispenser and an environmental source are not Items."

