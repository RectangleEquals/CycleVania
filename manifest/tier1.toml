kind = "struct"
status = "stable"
doc = "axis and angle. Replaces a three-value enum so that 'up, level or diagonally up, never down' is expressible."

[[class]]
path = "/Core/Kind"
kind = "struct"
status = "stable"
doc = "A picked CLASS path. path, is_a, and defaults() — the core-owned class default, one per class, READ and never built by content. This is how a token's authored values are compared without instantiating anything."

[[class]]
path = "/Core/Ref"
kind = "struct"
status = "stable"
doc = "A live INSTANCE reference. Never interchangeable with Kind: a class never appears in a value position and a path never in a type position."

[[class]]
path = "/Core/Tag"
kind = "struct"
status = "stable"
doc = "A dotted hierarchical label, picked rather than typed."

[[class]]
path = "/Core/TagQuery"
kind = "struct"
status = "stable"
doc = "A tag match with an exact/inherited toggle. Why an eligible-surface list survives every future surface being added."

[[class]]
path = "/Core/Cost"
kind = "struct"
status = "stable"
doc = "What an interaction spends."

[[class]]
path = "/Core/Quota"
kind = "struct"
status = "stable"
doc = "How many of something may exist, per scope."

[[class]]
path = "/Core/Diagnostic"
kind = "struct"
status = "stable"
doc = "An editor-time finding. Never blocks generation."

[[class]]
path = "/Core/Rng"
kind = "struct"
status = "stable"
doc = "The owned, forkable PRNG. Reached only through ctx.rng."

