  doc = "Which pipeline layer is asking."
  [[class.field]]
  name = "fidelity"
  type = "Fidelity"
  api = true
  final = true
  status = "stable"
  doc = "How real the geometry currently is."
  [[class.field]]
  name = "tolerance"
  type = "float"
  api = true
  final = true
  status = "stable"
  doc = "The bounded error of this fidelity rung. The ladder is monotone, so this only ever shrinks."
  [[class.field]]
  name = "rng"
  type = "Rng"
  api = true
  final = true
  status = "stable"
  doc = "The ONLY randomness source. Anything else is unreplayable."
  [[class.method]]
  name = "state_of"
  args = [ { name = "name", type = "String" } ]
  returns = "String"
  api = true
  final = true
  status = "stable"
  doc = "Read a declared world-state variable."
  [[class.method]]
  name = "pool"
  args = [ { name = "name", type = "String" } ]
  returns = "Pool"
  api = true
  final = true
  status = "stable"
  doc = "Read a declared resource pool."
  [[class.method]]
  name = "setting"
  args = [ { name = "name", type = "String" } ]
  returns = "MetaValue"
  api = true
  final = true
  status = "stable"
  doc = "Read a project setting."
  [[class.method]]
  name = "query"
  args = []
  returns = "Query"
  api = true
  final = true
  status = "stable"
  doc = "The three-axis query builder: what to trace, what to consider, what to report. Declarative filters, never closures — a predicate callback survives neither the binding contract nor the palette."
  [[class.method]]
  name = "path_to"
  args = [ { name = "target", type = "Ref<Object>" }, { name = "f", type = "QueryFilter" } ]
  returns = "Ref<Path>"
  api = true
  final = true
  status = "stable"
  doc = "Realise a path to a target."
