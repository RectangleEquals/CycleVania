  [[class.field]]
  name = "unlocked_by"
  type = "Ref<Rule>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  default = "AlwaysRule"
  doc = "What the occupant must hold before this node joins its network."

[[class]]
path = "/Core/StateSetterComponent"
extends = "/Core/Component"
kind = "object"
status = "stable"
doc = "Writes a world-state variable. The authoring surface for the non-monotone axis."

  [[class.field]]
  name = "variable"
  type = "String"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Which declared state variable this writes."

  [[class.field]]
  name = "to_value"
  type = "String"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "The value it writes."

  [[class.field]]
  name = "while_occupied_by"
  type = "Kind<Component>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "If set, the value holds only WHILE something carrying this component is present — which is what makes dwell an ordinary reading rather than a trigger kind."

[[class]]
path = "/Core/BlocksTraversalComponent"
extends = "/Core/Component"
kind = "object"
status = "stable"
doc = "Place me on an edge of this kind, and close it. Without this a barrier can only be authored as geometry, which violates gate-never-delete by construction."

  [[class.field]]
  name = "matching"
  type = "Kind<TraversalComponent>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Which kind of traversal edge this may be placed on."

  [[class.field]]
  name = "route"
  type = "Ref<Route>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
