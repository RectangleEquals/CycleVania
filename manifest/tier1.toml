  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "What comes back here."

  [[class.field]]
  name = "restores_occupant"
  type = "bool"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  default = "false"
