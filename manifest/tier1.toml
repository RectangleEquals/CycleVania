[[class]]
path = "/Core/TraversalComponent"
extends = "/Core/Component"
kind = "object"
status = "stable"
doc = "Turns a spatial delta into a directed graph edge. The thing that makes a staircase a route rather than scenery."

  [[class.method]]
  name = "run"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Span"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Horizontal distance this move covers."

  [[class.method]]
  name = "rise"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Span"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Vertical delta this move covers. Negative is downward."

  [[class.method]]
  name = "direction"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "DirectionCone"
  api = true
  final = false
  hook = true
  status = "stable"
  doc = "Permitted directions as a cone, so 'up, level or diagonally up, never down' is expressible."

  [[class.method]]
  name = "admits"
  args = [ { name = "ctx", type = "Ref<Context>" }, { name = "occupant", type = "Occupant" }, { name = "dir", type = "Vec3" } ]
  returns = "Ref<Rule>"
  api = true
  final = false
  hook = true
  status = "stable"
  default = "AlwaysRule"
  doc = "What the occupant must hold to make this move, IN THIS DIRECTION — so one edge can be open one way and gated the other."

  [[class.method]]
