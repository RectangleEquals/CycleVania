  [[class.method]]
  name = "clearance"
  args = [ { name = "ctx", type = "Ref<Context>" } ]
  returns = "Ref<CollisionBody>"
  api = true
  final = false
  hook = true
  status = "proposed"
  default = "the box implied by run x rise"
  doc = "PROPOSED. The swept volume that must be empty for the move to exist. run and rise describe only the endpoints, and admit a jump the real arc would not clear under a low ceiling."

[[class]]
path = "/Core/CheckpointComponent"
extends = "/Core/Component"
kind = "object"
status = "stable"
doc = "A place that returns the world to a known-good state. P15's second satisfaction route, and what lets the solver take an attractive one-way transition instead of refusing every irreversible edge."

  [[class.field]]
  name = "restores"
