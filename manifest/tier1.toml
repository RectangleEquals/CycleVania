  name = "SPATIAL"
  [[class.value]]
  name = "SPACE"
  [[class.value]]
  name = "AREA"
  [[class.value]]
  name = "REACH"
  [[class.value]]
  name = "WORLD"

[[class]]
path = "/Core/BooleanOp"
kind = "enum"
status = "stable"
doc = "Constructive solid geometry operations."
  [[class.value]]
  name = "UNION"
  [[class.value]]
  name = "SUBTRACT"
  [[class.value]]
  name = "INTERSECT"

[[class]]
path = "/Core/ResolveState"
kind = "enum"
status = "stable"
doc = "How committed a node is. A subtree may lag but never lead."
  [[class.value]]
  name = "PROJECTED"
  doc = "A revisable forecast. The only state from which a node may be removed."
  [[class.value]]
  name = "RESERVED"
  doc = "Committed to exist, with an envelope claimed. Removable only by recorded backtracking."
  [[class.value]]
  name = "REALIZED"
  doc = "Built and frozen."

[[class]]
path = "/Core/Detail"
kind = "enum"
status = "stable"
doc = "How much a query wants back. Detail is what you ASK for; fidelity is what EXISTS."
  [[class.value]]
  name = "SCOPE"
  doc = "Which room. Available from L1."
  [[class.value]]
  name = "COLLIDER"
  doc = "Which box, which face. From L2."
  [[class.value]]
  name = "INSTANCE"
  doc = "Which placed actor, with its content path and metadata. From L2."
  [[class.value]]
  name = "ISLAND"
  doc = "Which mesh island. From L3."
  [[class.value]]
  name = "POLYGON"
  doc = "Which hull polygon or occupancy cell. From L3."
  [[class.value]]
  name = "TRIANGLE"
  doc = "Which triangle, with an interpolated normal. From L4."

[[class]]
path = "/Core/Fidelity"
kind = "enum"
status = "stable"
doc = "How real the geometry is. The ladder is monotone — each rung only tightens, so tolerance only shrinks."
  [[class.value]]
  name = "ENVELOPE"
  doc = "Tolerance is the envelope's own slack."
  [[class.value]]
  name = "HULL"
  doc = "Tolerance is the contouring tolerance."
  [[class.value]]
  name = "GEOMETRY"
  doc = "Tolerance is zero."

[[class]]
path = "/Core/Strictness"
kind = "enum"
status = "stable"
doc = "How hard a spine slot or preference must hold. Every relaxation is declared; nothing is loose by accident."
  [[class.value]]
  name = "REQUIRED"
  doc = "Must hold; if it cannot, generation fails with a diagnostic."
  [[class.value]]
  name = "PREFERRED"
  doc = "Strongly biased; may be relaxed when infeasible, and is REPORTED when it is."
  [[class.value]]
  name = "OPTIONAL"
  doc = "The generator decides freely; absence is expected."

[[class]]
path = "/Core/SkipPolicy"
kind = "enum"
status = "stable"
doc = "Per-lock sequence-break policy. A designer marks two or three gates, not two hundred."
  [[class.value]]
  name = "TOLERATED"
  doc = "A path exists; other emergent paths are fine. The default, because real games ship tolerated skips deliberately."
  [[class.value]]
  name = "EXACT"
  doc = "Report every alternative route found."
  [[class.value]]
  name = "GUARDED"
  doc = "Actively verify no alternative exists at that sphere, and fail loudly if one does. Also what decides whether a discovered shortcut may be adopted."

[[class]]
path = "/Core/Interpolation"
kind = "enum"
status = "stable"
doc = "How a curve row interpolates between keys. Declared PER ROW — UE fixes it per table only because a CSV has one header row, which JSON does not."
  [[class.value]]
  name = "CONSTANT"
  [[class.value]]
  name = "LINEAR"
  [[class.value]]
  name = "CUBIC"

[[class]]
path = "/Core/Trivalent"
kind = "enum"
status = "stable"
doc = "Three-valued truth. A confident wrong answer is worse than an admitted unknown, so the API returns this rather than a bool wherever geometry is still approximate."
  [[class.value]]
  name = "YES"
  [[class.value]]
  name = "NO"
  [[class.value]]
  name = "AMBIGUOUS"
  doc = "Inside the ambiguous band. Resolve, never guess — and a decision that returns this re-asks at the next fidelity rung by construction."
