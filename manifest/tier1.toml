  [[class.value]]
  name = "NEVER"
  [[class.value]]
  name = "ON_REENTER"
  [[class.value]]
  name = "FROM_SOURCE"
  [[class.value]]
  name = "ON_TIMER"

[[class]]
path = "/Core/InstanceScope"
kind = "enum"
status = "stable"
doc = "How wide an instance query or effect reaches. There is deliberately NO FLOOR member: a floor-scoped instance query would stop at a boundary the geometry does not stop at."
