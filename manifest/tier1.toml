  [[class.field]]
  name = "scope"
  type = "InstanceScope"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "How far this checkpoint's effect reaches."

[[class]]
path = "/Core/FastTravelComponent"
extends = "/Core/Component"
kind = "object"
status = "stable"
doc = "A node in a travel network. Not cosmetic: a network collapses traversal cost across the whole World, and difficulty here IS slack spent against a budget."

  [[class.field]]
  name = "network"
  type = "String"
  api = true
  mutable = true
  exposed = true
  status = "stable"
  doc = "Nodes sharing a network name connect to each other."

  [[class.field]]
  name = "cost"
  type = "Ref<Budget>"
  api = true
  mutable = true
  exposed = true
  status = "stable"
