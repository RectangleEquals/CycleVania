  [[class.value]]
  name = "POS_Z"
  [[class.value]]
  name = "NEG_Z"

[[class]]
path = "/Core/Role"
kind = "enum"
status = "stable"
doc = "What a placement turned out to be. An OUTPUT, assigned after the search from what it ran into — never declared."
  [[class.value]]
  name = "DECORATION"
  doc = "No mechanical consequence."
  [[class.value]]
  name = "OBSTACLE"
  [[class.value]]
  name = "TRAVERSAL"
  [[class.value]]
  name = "GATE"
  [[class.value]]
  name = "LANDMARK"

[[class]]
path = "/Core/ItemClass"
kind = "enum"
status = "stable"
doc = "What kind of reward something is. An INPUT the developer declares."
  [[class.value]]
  name = "PROGRESSION"
  doc = "May appear in logic. The conservative default."
  [[class.value]]
  name = "USEFUL"
  doc = "Tunes route difficulty, spends slack, never gates."
  [[class.value]]
  name = "BONUS"
  doc = "Rewards optional exploration. Auto-assigned to anything accessible solely through a relaxation."
  [[class.value]]
  name = "FILLER"
  doc = "Satisfies density. Currency, ammo, consumables."

[[class]]
path = "/Core/CollisionLayer"
