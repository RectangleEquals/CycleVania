# The cross-target determinism probe, built for wasm32 and read back by scripts/wasm-golden.cjs.
# Named per-crate: all workspace examples share one output directory, so a generic name would collide
# with cv-core's probe.
[[example]]
name = "determinism_probe"
crate-type = ["cdylib"]

