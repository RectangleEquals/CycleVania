[package]
name = "cv-bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Host-facing bindings: a native Node addon (napi-rs v3) and a WASM module (wasm-bindgen)."

[lints]
workspace = true

[lib]
# cdylib → the .node addon / .wasm module; rlib → so other crates/tests can link it.
crate-type = ["cdylib", "rlib"]

[features]
# Native Node addon by default; the WASM build opts in with `--no-default-features --features wasm`.
default = ["napi-addon"]
napi-addon = ["dep:napi", "dep:napi-derive"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
cv-core = { workspace = true }
cv-cvb = { workspace = true }
cv-assets = { workspace = true }
cv-vm = { workspace = true }
cv-determinism = { workspace = true }
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true }
